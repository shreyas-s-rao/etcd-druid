name: Build
on:
  push:
    branches:
      - master
      - 'hotfix-**'
      - 'release-**'
  pull_request_target:

jobs:
  build:
    uses: ./.github/workflows/base.yaml
    with:
      mode: snapshot
    secrets: inherit
    # Run for push events unconditionally; for PR events (labeled/synchronize), only run if ok-to-test label exists
    if: ${{ github.event_name == 'push' || (vars.DEFAULT_LABEL_OK_TO_TEST != '' && contains(github.event.pull_request.labels.*.name, vars.DEFAULT_LABEL_OK_TO_TEST)) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@master
    needs:
      - build
    # Run for push events unconditionally; for PR events (labeled/synchronize), only run if ok-to-test label exists
    if: ${{ github.event_name == 'push' || (vars.DEFAULT_LABEL_OK_TO_TEST != '' && contains(github.event.pull_request.labels.*.name, vars.DEFAULT_LABEL_OK_TO_TEST)) }}
    permissions:
      id-token: write
      contents: write
